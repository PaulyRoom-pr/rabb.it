      padding: 10px 28px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;

    .logout-btn:hover {

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB0oC7igOIP6DCE6ZRQmWOe2E7Ennt1t_U",
      authDomain: "rabbit-4d9dd.firebaseapp.com",
      projectId: "rabbit-4d9dd",
      storageBucket: "rabbit-4d9dd.firebasestorage.app",
      messagingSenderId: "931872074964",
      appId: "1:931872074964:web:d4fc4c45675ed3f6ba1f41",
      measurementId: "G-0YY44D033K"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // Not logged in → send to login
        window.location.href = '/login';
        return;
      }
      document.getElementById('userInfo').textContent = `Logged in as ${user.email}`;
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = '/';
    });
  </script>
