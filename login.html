  <title>Log In – Rabbit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f06a5a 0%, #e85a4f 40%, #d94a3f 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 40px 36px;
      width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo img { width: 56px; height: 56px; }
    h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; color: #1a1a1a; }
    .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 28px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    .form-group input {
      width: 100%; border: 1.5px solid #e0e0e0; border-radius: 10px;
      padding: 12px 14px; font-size: 15px; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #e85a4f; }
    .btn {
      width: 100%; background: #e85a4f; color: #fff; border: none; border-radius: 999px;
      padding: 14px 0; font-size: 16px; font-weight: 600; cursor: pointer;
      margin-top: 8px; transition: background 0.2s;
    }
    .btn:hover { background: #d94a3f; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg { color: #e74c3c; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
    .footer-text { text-align: center; margin-top: 24px; font-size: 14px; color: #666; }
    .footer-text a { color: #e85a4f; text-decoration: none; font-weight: 500; }
    .back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #999; text-decoration: none; }
  </style>
</head>

    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to continue watching with friends</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn" id="loginBtn">Log In</button>
      <p class="error-msg" id="errorMsg"></p>
    </form>

    <p class="footer-text">
      Don't have an account? <a href="/signup">Sign Up</a>
    </p>
    <a href="/" class="back">← Back to Rabbit</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB0oC7igOIP6DCE6ZRQmWOe2E7Ennt1t_U",
      authDomain: "rabbit-4d9dd.firebaseapp.com",
      projectId: "rabbit-4d9dd",
      storageBucket: "rabbit-4d9dd.firebasestorage.app",
      messagingSenderId: "931872074964",
      appId: "1:931872074964:web:d4fc4c45675ed3f6ba1f41",
      measurementId: "G-0YY44D033K"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = '/home';
    });

    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = '/home';
      } catch (err) {
        let message = 'Login failed. Please try again.';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          message = 'Invalid email or password.';
        }
        if (err.code === 'auth/too-many-requests') message = 'Too many attempts. Try again later.';
        errorMsg.textContent = message;
        errorMsg.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });
  </script>
